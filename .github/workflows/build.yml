name: Build Psiphon
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build Solution
        run: |
          $sln = Get-ChildItem -Recurse -Filter *.sln | Select-Object -First 1
          if ($sln) {
            Write-Output "Found solution: $($sln.FullName)"
            msbuild $sln.FullName /p:Configuration=Release /p:Platform=Win32
          } else {
            Write-Error "No .sln file found in repository!"
            exit 1
          }
